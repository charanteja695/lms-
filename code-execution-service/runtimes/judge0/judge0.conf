# Judge0 server settings this service expects. Adapt, then VERIFY every key against the docs of the Judge0 version you
# deploy (names and defaults have changed between releases; this could not be tested against a running Judge0).
# See README.md next to this file for why each one matters.

# --- the API contract this service uses ---------------------------------------------------------------------------
ENABLE_WAIT_RESULT=true
ENABLE_COMPILER_OPTIONS=true
# The engine ids of the C and C++ entries in runtimes/languages.json (50 and 54 on CE 1.13.1):
ALLOWED_LANGUAGES_FOR_COMPILER_OPTIONS=C,C++
ENABLE_COMMAND_LINE_ARGUMENTS=false
ENABLE_BATCHED_SUBMISSIONS=false
ENABLE_SUBMISSION_DELETE=false

# --- who may call it ----------------------------------------------------------------------------------------------
AUTHN_HEADER=X-Auth-Token
AUTHN_TOKEN=change-me-a-long-random-secret   # the same value goes in JUDGE0_AUTH_TOKEN for the workers

# --- limits: the ceiling if a request ever asks for more than a problem should ---------------------------------------
MAX_NUMBER_OF_RUNS=1
CPU_TIME_LIMIT=5
MAX_CPU_TIME_LIMIT=45          # >= PROBLEM_MAX_TIME_LIMIT_MS (15 s) x the slowest language multiplier (3.0)
WALL_TIME_LIMIT=10
MAX_WALL_TIME_LIMIT=100
MEMORY_LIMIT=256000            # KB
MAX_MEMORY_LIMIT=1048576       # KB: PROBLEM_MAX_MEMORY_MB (512) x the JVM languages' multiplier (2)
STACK_LIMIT=64000              # KB
MAX_PROCESSES_AND_OR_THREADS=60
MAX_FILE_SIZE=1024             # KB; this service sends its own MAX_OUTPUT_BYTES
ENABLE_PER_PROCESS_AND_THREAD_TIME_LIMIT=false
ENABLE_PER_PROCESS_AND_THREAD_MEMORY_LIMIT=false

# --- isolation (verify the key names on your version) ---------------------------------------------------------------
# Student code must have no network. Both keys exist in some releases; set whichever yours has.
ENABLE_NETWORK=false
ALLOW_ENABLE_NETWORK=false
